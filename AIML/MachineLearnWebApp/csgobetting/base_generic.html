<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}<title>CSGOBetting</title>{% endblock %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700">  
    <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css">               
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">                                      
    <link rel="stylesheet" type="text/css" href="{% static 'css/datepicker.css' %}">
    <link rel="stylesheet" type="text/css" href="slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="slick/slick-theme.css"/>
    <link rel="stylesheet" href="{% static 'css/templatemo-style.css' %}">  
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <div class="container-fluid">
      <div class="tm-main-content" id="top">
            <div class="tm-top-bar-bg"></div>    
            <div class="tm-top-bar" id="tm-top-bar">
                <div class="container">
                    <div class="row">
                        <nav class="navbar navbar-expand-lg narbar-light">
                            <a class="navbar-brand mr-auto" href="{% url 'index' %}">
                                {% load static %}
                                <img src="{% static 'img/terrorist-cat.png' %}" alt="Site logo" width="250">
                            </a>
                            <button type="button" id="nav-toggle" class="navbar-toggler collapsed" data-toggle="collapse" data-target="#mainNav" aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <div id="mainNav" class="collapse navbar-collapse tm-bg-white">
                                <ul class="navbar-nav ml-auto">
                                      <li class="nav-item">
                                        <a class="nav-link" href="{% url 'index' %}">Bets<span class="sr-only">(current)</span></a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="{% url 'wildbot' %}">wildBOT</a>
                                    </li>
                                </ul>
                            </div>                            
                        </nav>
                    </div> 
                    
                </div>
            </div>
            <div class="row">
                <div style="width: 100%">{% block content %}{% endblock %}</div>
            </div>
        </div>  
        <div class = "footer"><p>betterBOT created by George and Steph</p>
            <p>Last updage: April 8th, 2020</p></div> 
    </div>
</body>
</html>
